# Construction de sme-media-build : FFmpeg 8.1 partagé (liste d'autorisation), libmpv liée à ces DLL,
# PyAV 18 compilé contre elles ; balayage bloquant (DA-7) ; release avec la source correspondante (DA-8).
# Déclenchement manuel seulement. Les actions tierces sont épinglées par commit.
#
# L'image de la chaîne d'outils n'est ni mise en miroir ni publiée par ce workflow : un paquet créé par le
# GITHUB_TOKEN d'un dépôt public hérite de sa visibilité, donc public, et un paquet public ne redevient jamais
# privé (documentation GitHub). Elle est lue par digest (recipe/run-build.sh) ; sa copie de référence est tenue
# hors ligne (README, « Reproduire »).
name: construction

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Si renseignée : publier une release sous cette étiquette"
        type: string
        default: ""
      livraison:
        description: "Release de livraison (sinon : préversion de mesure)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sources:
    name: sources épinglées
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Récupérer chaque composant à son commit
        run: bash recipe/fetch-sources.sh out/sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources
          path: out/sources
          compression-level: 0
          if-no-files-found: error

  # Conditions explicites : success() implicite porterait sur tous les travaux dont on dépend, directement ou non.
  build:
    name: FFmpeg partagé + libmpv (mingw)
    needs: sources
    if: ${{ !cancelled() && needs.sources.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Libérer de la place
        run: bash recipe/free-disk.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sources
          path: out/sources
      - name: Construire dans l'image épinglée
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          bash recipe/run-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-bin
          path: out/build/bin
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-unstripped
          path: out/build/unstripped
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-probe
          path: out/build/probe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dev
          path: out/build/dev
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-maps
          path: out/build/maps
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: build-meta
          path: |
            out/build/meta
            out/build/logs

  pyav:
    name: PyAV 18 (MSVC) contre ces DLL
    needs: [sources, build]
    if: ${{ !cancelled() && needs.sources.result == 'success' && needs.build.result == 'success' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sources
          path: out/sources
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dev
          path: out/build-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Outils épinglés
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r pyav/requirements-build.txt
      - name: Compiler et assembler le wheel
        run: python pyav/build_pyav.py --sources out/sources --ffmpeg out/build-dev/ffmpeg --out out/wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: out/wheel
          if-no-files-found: error

  audit:
    name: balayage bloquant et inventaire
    needs: [build, pyav]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pyav.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{build-bin,build-unstripped,build-probe,build-maps,wheel}"
          path: in
      - name: Balayage DA-7 (DLL, EXE, wheel)
        run: |
          mkdir -p out/audit
          set -a; source pins.env; set +a
          python3 recipe/audit.py scan --maps in/build-maps --identical-to in/build-bin \
            --report out/audit/scan.json in/build-bin in/build-unstripped in/build-probe in/wheel
      - name: Inventaire lié
        if: ${{ always() }}
        run: |
          python3 recipe/audit.py inventory --maps in/build-maps --pins pins.env \
            --json out/audit/inventory.json --md out/audit/inventory.md
          cat out/audit/inventory.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: audit
          path: out/audit

  release:
    name: release
    needs: [sources, build, pyav, audit]
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.audit.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{sources,build-bin,build-dev,build-maps,build-meta,wheel,audit}"
          path: in
      - name: Assembler
        run: bash recipe/package-release.sh "${{ inputs.release_tag }}" in out/release
      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVRAISON: ${{ inputs.livraison }}
        run: |
          # Une seule source pour les notes : RELEASE_NOTES.md ; seule la ligne de statut dépend du type de release.
          if [ "$LIVRAISON" = "true" ]; then
            statut="release de livraison, destinée à SME Subtitle Editor (chantier LIBMPV)."
            type_release=()
          else
            statut="préversion, produite pour mesure ; elle n'est livrée avec aucune version de SME Subtitle Editor."
            type_release=(--prerelease)
          fi
          sed "s|@STATUT@|$statut|" RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          grep -qF "$statut" "$RUNNER_TEMP/notes.md"
          gh release create "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            "${type_release[@]}" --title "sme-media ${{ inputs.release_tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md" out/release/*
